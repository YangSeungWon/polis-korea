name: Daily tracker refresh

# tracker(국정평가·정당지지·차기주자)의 상시 소스 = 전국 정기(정례)조사를 매일 갱신.
# NESDC는 정기조사를 '언급 선거'로 분류해 VT012("기타") 밖(대선 등)에도 흩어두므로, gubun
# 필터 없이 전체 목록 + sido='전국'으로 긁는다(--all-list). 갤럽 자체조사 등 VT012 누락분 회수.
# 갤럽(금)·리얼미터(월)·NBS 등 발표 요일이 제각각이라 주1회면 최대 ~6일 지연 → 매일로 변경.
# 증분이라 신규 폴 없는 날은 push skip(노이즈 0). repo가 PUBLIC이라 Actions 무료.
# daily-refresh(선거 폴+빌드)와 별개지만 같은 data-pipeline concurrency group이라 큐잉 순차 실행.
#
# ⚠ 핵심: PDF 코퍼스를 CI에 들고 오지 않는다(과거 PDF는 로컬에만). 대신
#   - data/raw/nesdc_etc_polls.csv (목록)를 git에 커밋 → scrape가 항상 증분(0부터 재스크랩 X)
#   - approval_*.json / aggregated_etc.json (전체 history)을 커밋 → 추출기 --incremental이 done skip
# 따라서 cold run도 "신규 폴만" 처리 → 수 분. (이전 설계는 Release에서 PDF를 받다 5h 초과해 실패.)
on:
  schedule:
    - cron: '47 21 * * *'   # 매일 UTC 21:47 = KST 06:47 (daily-refresh 21:37 뒤 큐잉)
  workflow_dispatch: {}

# daily-refresh와 같은 그룹 — raw 데이터 동시 접근 방지(큐잉).
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      # cid_decode.py가 NotoSansCJK-Regular.ttc(하드코딩 경로 /usr/share/fonts/opentype/noto)로
      # 한글 cid 깨진 PDF 복구(extract_party_support 등). 미설치 시 FileNotFoundError로 abort.
      - name: Install Noto CJK font (cid_decode 한글 복구용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # 신규로 받은 VT012 PDF만 캐시(재시도 시 재다운로드 회피용 — 정합성은 커밋된 CSV/JSON이 보장).
      # daily와 분리된 네임스페이스(restore-keys에 'rawdata-' 없음) — 거대한 daily 캐시 안 끌어옴.
      - name: Cache new VT012 PDFs
        uses: actions/cache@v4
        with:
          path: data/raw/pdf
          key: tracker-pdf-${{ github.run_id }}
          restore-keys: tracker-pdf-

      # 전체 목록(gubun 무시) + sido='전국' 필터로 증분 스크랩. NESDC가 정기조사를 언급 선거
      # (대선 등) gubun으로 분류해 VT012 밖에 두는 폴(갤럽 자체조사 등)까지 회수. 목록 최신순 →
      # 마지막 신규 이후 5p 연속 기존이면 조기 종료(지역 폴이 페이지를 채워 3p는 빠듯 → 5p 마진).
      - name: Scrape 전국 정기조사 (전체목록·전국필터, 커밋 CSV 기준 증분)
        run: |
          python scripts/fetch/scrape_nesdc.py \
            --all-list --csv data/raw/nesdc_etc_polls.csv \
            --stop-after-known-pages 5

      # NESDC는 목록을 먼저 등록하고 결과 PDF를 나중에 첨부하는 경우가 많음(주간집계 등).
      # scrape 당시 PDF 없던 pending 건을 재시도 — 못 받으면 다음 주 run이 회수.
      - name: Refresh pending PDFs (늦게 첨부된 결과표 회수)
        run: python scripts/fetch/refresh_pending_pdfs.py --csv data/raw/nesdc_etc_polls.csv --max-days 14

      # 리얼미터는 국정수행평가를 NESDC에 등록 안 함(정당지지만) → 자체 사이트 '보도용' PDF로 보완.
      # ⚠️ realmeter.net이 GitHub Actions 러너 IP를 차단 → CI에선 항상 "총 0건" (NESDC IP차단과 동일).
      #    따라서 리얼미터 국정평가는 CI로 안 차오름 → 로컬에서 주기적으로 fetch+extract+commit 해야 함
      #    (이 단계는 차단 풀리면 자동 재개되도록 남겨둠). 배경은 docs/tracker-pipeline.md §1-1.
      - name: Fetch 리얼미터 자체발표 (국정평가 — NESDC 미등록분, CI는 IP차단으로 보통 0건)
        run: python scripts/fetch/fetch_realmeter_self.py --max-pages 3 || echo "realmeter.net fetch 실패 — 다음 run 회수"

      - name: Extract tracker data (incremental — 기존 보존·신규만 추가)
        run: |
          set -e
          for s in gallup realmeter nbs hrc general; do
            echo "=== extract_approval_$s ==="
            python scripts/parse/extract_approval_$s.py --incremental
          done
          # 리얼미터 자체발표분 병합(NESDC realmeter 추출 뒤 — 같은 파일에 주단위 우선 병합).
          echo "=== extract_approval_realmeter --source self ==="
          python scripts/parse/extract_approval_realmeter.py --source self
          echo "=== extract_party_support ==="
          python scripts/parse/extract_party_support.py --incremental
          echo "=== canon_agency (조사기관 표기 통일 — house-effect 정확도) ==="
          python scripts/build/canon_agency.py
          # 이 잡이 갱신하는 건 정확히 tracker.html·홈 capability가 본문에 인용하는 값이다.
          # 데이터만 올리고 페이지를 안 만들면, 다음 daily가 돌 때까지 화면이 옛 숫자를
          # 사실처럼 말한다. sitemap은 내용 해시라 마지막.
          echo "=== 정적 요약 재생성 (tracker 요약 · 홈 capability · sitemap) ==="
          python scripts/build/build_tracker_static.py
          python scripts/build/build_home_capabilities.py
          python scripts/build/build_sitemap.py

      # 갱신된 목록 CSV + 추출 JSON을 함께 커밋(CSV가 stale하면 다음 run이 재스크랩하므로 필수).
      - name: Commit & push if changed
        run: |
          git config user.name "polis-bot"
          git config user.email "noreply@anthropic.com"
          git add data/raw/nesdc_etc_polls.csv \
                  data/polls/approval_gallup.json data/polls/approval_realmeter.json \
                  data/polls/approval_nbs.json data/polls/approval_hrc.json \
                  data/polls/approval_general.json data/polls/aggregated_etc.json \
                  data/polls/approval_general.scancache.json
          # sitemap-*.xml은 sitemap.xml(index)이 가리키는 층 파일 — 함께 넣지 않으면
          # 매일 만들고 매일 버려 index와 층 내용이 어긋난다.
          git add tracker.html index.html sitemap.xml sitemap-*.xml data/sitemap_lastmod.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "tracker 변경 없음 — push skip"
          else
            git commit -m "tracker 데이터 갱신 (자동·VT012): $(date +%Y-%m-%d)"
            # 다른 스케줄 잡/배포가 먼저 올라간 경우(fetch first 거부) 대비 — rebase 후 재시도.
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin master && git push; then ok=1; break; fi
              echo "push 레이스 — 재시도 $i/3"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "push 3회 실패"; exit 1; }
          fi
