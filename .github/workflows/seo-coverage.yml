name: Weekly SEO coverage (색인·노출 수집)

# Search Console Search Analytics로 '우리가 낸 5,027쪽 중 몇 쪽이 실제 검색에
# 나타나는가'를 주간으로 쌓는다. sitemap 완전성 검사는 **우리가 낸 것**만 보고,
# 2026-07에 2,190쪽이 '크롤링됨-미색인'이 됐을 때 전부 초록이었다.
#
# 주 1회인 이유: GSC 확정 데이터가 2~3일 지연되고 색인 재평가는 몇 주 단위로 움직인다.
# 매일 돌리면 같은 사실을 7번 적으면서 diff만 키운다. Search Analytics 쿼터는 분당
# 1,200이라 이 잡이 쓰는 요청 몇 개는 부담이 아니다 — 빈도는 쿼터가 아니라 신호가 정한다.
#
# ⚠️ 인증: GCP 서비스 계정 JSON을 secrets.GSC_SA_JSON에.
#   그 계정 이메일(xxx@yyy.iam.gserviceaccount.com)을 GSC 속성 '사용자 및 권한'에
#   **제한된 사용자**로 추가해야 한다. 추가 안 하면 sites 목록이 비어 스크립트가
#   그 사실을 그대로 말하고 죽는다(조용히 0을 적지 않는다).
#
# ⚠️ 결손: 질의가 실패하면 그 주를 아예 안 쓴다(docs/absence.md '못 받았다').
#   실패를 0으로 적으면 다음 주 회귀 검사가 없던 급락을 본다.
#
# ⚠️ GSC 보존 16개월. 그 밖은 API로도 못 가져온다 — 이 잡을 붙인 시점 이전은 영구 결손.

on:
  schedule:
    - cron: '20 22 * * 1'   # 매주 월 UTC 22:20 = KST 화 07:20 (daily 21:37 뒤)
  workflow_dispatch: {}

concurrency:
  group: data-pipeline      # daily-refresh·tracker와 같은 그룹 — data/ 동시 쓰기 방지
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install google-auth requests

      # 비밀이 없으면 실패가 아니라 건너뛴다 — 포크 PR·키 준비 전에도 빨간 X를 안 만든다.
      - name: GSC 비밀 확인
        id: gate
        env:
          KEY: ${{ secrets.GSC_SA_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "secrets.GSC_SA_JSON 없음 — 수집 건너뜀 (색인율은 '모른다'로 남는다)"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      # 층 정의의 단일 출처가 sitemap-*.xml이라 저장소에 있는 것을 그대로 읽는다.
      - name: Search Analytics 수집 (층별 노출 페이지 수 + Inspection 대기열)
        if: steps.gate.outputs.ok == '1'
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: python scripts/fetch/fetch_gsc.py --window 7 --roster-window 90

      # 대기열을 조금씩 갉아먹는다. 속당 하루 2,000이 상한이라 4,870쪽이면 3주다.
      # 주간 잡이 매주 1,900씩 물어 3주면 전수가 찬다 — 이미 물어본 URL은 건너뛰므로
      # 그 뒤로는 신규(새 페이지)만 소비한다. 429가 와도 실패가 아니라 '오늘 몫 끝'이라
      # exit 2를 통과시킨다 — 지금까지 물어본 건 이미 저장돼 있다.
      - name: URL Inspection (노출 0을 미색인과 '안 뜬 것'으로 가르기)
        if: steps.gate.outputs.ok == '1'
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          python scripts/fetch/fetch_gsc_inspect.py --limit 1900 || {
            code=$?
            [ "$code" = 2 ] && echo "쿼터 소진 — 다음 주 이어서" || exit $code
          }

      - name: Commit & push if changed
        if: steps.gate.outputs.ok == '1'
        run: |
          git config user.name "polis-bot"
          git config user.email "noreply@anthropic.com"
          # data/seo/ 전부 — coverage.json(시계열)·pages_seen.json·inspect_queue.txt·
          # appearance.json. 하나라도 빠지면 만들고 버리는 그 사고의 다음 자리가 된다.
          git add data/seo
          if git diff --staged --quiet; then
            echo "SEO 수집 변경 없음 — push skip"
          else
            git commit -m "SEO 색인·노출 수집 (자동·GSC): $(date +%Y-%m-%d)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin master && git push; then ok=1; break; fi
              echo "push 레이스 — 재시도 $i/3"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "push 3회 실패"; exit 1; }
          fi

      # ⚠️ 순서가 중요하다 — **커밋 뒤에** 검사한다.
      # 검사를 먼저 두면 진짜 회귀가 났을 때 잡이 거기서 죽고, 그 회귀를 증명하는
      # 데이터가 커밋 안 된 채 러너와 함께 사라진다. 다음 주 기준선은 회귀 이전
      # 값으로 남아 같은 실패가 매주 새로 발견되거나(또는 조용히 지나가거나) 한다.
      # 기록이 먼저고 판정이 나중이다. 여기서 빨개져도 데이터는 이미 저장소에 있다.
      - name: 색인 회귀 검사 (커밋 뒤 — 증거를 남기고 판정한다)
        if: steps.gate.outputs.ok == '1'
        run: python tests/test_seo_coverage.py
