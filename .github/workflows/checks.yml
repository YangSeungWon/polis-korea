name: Checks (구조 불변식)

# 데이터가 아니라 '구조'를 지키는 가드. 빌드 산출물이 정본과 어긋난 채 커밋되는 걸 막는다.
#
# 지금 지키는 것:
#   nav 단일 출처 · 신뢰 상태 적용 범위 · 비교 모델 불변조건 · 인물 링크 무결성
#   · archive 구조(앵커·그룹) · 크롤 경로(홈→허브→archive) · 글씨 대비 · 범례 멱등
#   · 지역 페이지 · sitemap 완전성 · 연표 레이아웃 · 공약 카피 · 숫자 표기
#   · 생성기 멱등(재실행 후 저장소 동일) · 회차 간 구조 이상치
#   · 구조적 QA(3계열 규칙) · 링크 그래프 연결성 · 신선도 · 선거구 계보
#   · UI 불변식(실제 브라우저 — 넘침·런타임 오류·리소스 404·범례·토글 잔존)
#
# 전부 '화면은 멀쩡한데 조용히 틀리는' 종류를 잡는다. 비교에서 단위가 사라지면 실제로
# 없던 변화가 만들어지고, 앵커가 빠지면 외부 링크가 죽고, 크롤 경로가 끊기면 색인이
# 되돌아간다 — 셋 다 눈으로는 안 보인다.
#
# nav 단일 출처:
#   sync_nav_html.py가 nav 정본인데, 페이지 생성기가 nav HTML 사본을 템플릿에 박으면
#   메뉴가 바뀔 때마다 조용히 어긋난다. 실제로 '역대 판세'가 '타임라인'으로 4,200여
#   페이지에 굳어 있었다. 생성기가 render_nav()를 쓰는 한 이 검사는 항상 0이다.
#
# 글씨 대비:
#   정당 원색은 면(fill) 색이다. 글씨로 쓰면 146개 중 라이트 87·다크 93개가 본문
#   대비 4.5:1을 못 넘는다 — 정의당 노랑은 흰 배경에서 1.17:1로 사실상 안 보인다.
#   렌더러가 color:${pcol(...)} 같은 걸 새로 쓰면 여기서 잡는다.
#
# 새 불변식이 생기면 이 잡에 단계로 추가할 것 — 배포(pages.yml)를 막지 않는 별도 잡이라
# 실패해도 사이트는 계속 뜨고, 빨간 X로 알린다.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: nav 단일 출처 (생성기가 사본을 박지 않았는지)
        run: python scripts/build/sync_nav_html.py --check

      - name: 신뢰 상태 (확정/잠정 적용 범위·상속·시리즈 provenance)
        run: node tests/test_trust_states.mjs

      - name: 비교 모델 불변조건 (단위가 조용히 사라지지 않는지)
        run: python tests/test_comparison.py

      - name: 후보↔인물 링크 (죽은 링크·억지 매칭 없는지)
        run: python tests/test_person_links.py

      - name: archive 구조 (앵커·그룹 보존)
        run: python tests/test_archive_structure.py

      - name: 크롤 경로 (홈→허브→archive 유지)
        run: python tests/test_crawl_paths.py

      - name: 지역 페이지 (없는 값이 0으로 새지 않는지)
        run: python tests/test_region_pages.py

      - name: sitemap (새 페이지 유형이 조용히 빠지지 않는지)
        run: python tests/test_sitemap.py

      # 화면을 보기 전에 데이터만으로 잡는다. 2026-08 시군구의회 사건은 race 수가
      # 그대로여서 개수 검사로는 안 잡히고 sigungu 결측률로만 드러난다.
      - name: 회차 간 구조 이상치 (직위 소실·지역 필드 결측)
        run: python scripts/audit/audit_structure.py

      # 비교 파일이 있는데 회차 메타에 링크가 없으면 화면엔 아무것도 안 나온다.
      # 손으로 관리하면 둘이 어긋나고, 어긋난 쪽은 조용하다.
      - name: 비교 파일 ↔ 회차 메타 링크
        run: python scripts/build/link_comparisons.py --check

      # 오늘 나온 결함이 세 계열로 수렴해 규칙으로 승격했다:
      #   결손 ≠ 0 / 문자열 동일성 ≠ 의미 동일성 / 근본 수정 뒤 옛 우회책 제거
      - name: 구조적 QA (결손 표기·정당 동일성·옛 우회책·비교 노출)
        run: python tests/test_structure_qa.py

      # 링크 '개수'가 아니라 '연결성' — 어느 축에서 시작해도 이동 가능한가.
      # false link 0을 unresolved 감소보다 우선한다.
      - name: 링크 그래프 (대표 경로·고아·false link)
        run: python tests/test_link_graph.py

      # 깨진 내부 링크는 화면이 멀쩡해서 눈으로는 안 보인다 — 실제로 15종이 죽어 있었다.
      # 데이터 신선도는 경고만 낸다(외부 발표 지연과 fetcher 고장을 코드로 못 가른다).
      - name: health (깨진 내부 링크·데이터 신선도)
        run: python scripts/audit/health.py --strict

      # '최근 데이터 없음' ≠ '수집 실패'. 갤럽 여름 휴간을 지연으로 부르지 않는다.
      - name: 신선도 판정 (휴간·CI 차단·지연 구분)
        run: python tests/test_freshness.py

      # 총선 normalization — 완료조건은 화면이 아니라 '비교 가능/불가능을 데이터로
      # 판정할 수 있는가'다. 2024년 실제 획정 변화를 fixture로 고정한다.
      - name: 선거구 계보 (비교 가능 단위 판정)
        run: python tests/test_district_lineage.py

      # 정당 문자열 ≠ 비교 identity. 분리하지 않으면 같은 버그가 연산마다 다르게 난다
      # (승자 판정은 same_party, 득표 집계는 raw name → 국민의힘 +46%p/미래통합당 -45%p).
      - name: 정당 identity (개명·합당 구분·resolver 우회 금지)
        run: python tests/test_party_identity.py

      - name: 연표 레이아웃 (넓은 화면 벌어짐 · 좁은 화면 해제)
        run: python tests/test_chronology_layout.py

      - name: 공약 카피 (분모 오해·파이프라인 말투)
        run: node tests/test_pledge_copy.mjs

      - name: 숫자 표기 (값 / 무투표 / 자료 없음 구분)
        run: node tests/test_number_format.mjs

      # 생성기가 '성공했는가'가 아니라 '저장소가 예상 상태인가'를 본다.
      # nav 363개 사고는 생성기가 매일 성공하고 결과가 매일 버려져서 났다.
      - name: 생성기 재실행 후 저장소 동일 (미커밋 산출물·손수정)
        run: bash scripts/build/regen_check.sh

      - name: 글씨 대비 (정당 원색이 글씨로 새지 않는지)
        run: node tests/test_text_contrast.mjs

      - name: 격차 명도 키 (재렌더에 범례가 쌓이지 않는지)
        run: node tests/test_viz_legend.mjs

  # UI 불변식은 실제 브라우저가 필요해 별도 잡으로 둔다 — chromium 설치에 1~2분 걸리고,
  # 실패해도 위 구조 검사가 독립적으로 결과를 내야 한다.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      # 지도 모듈은 gitignore된 빌드 산출물이다(src/history/*.ts → assets/*.js).
      # 이걸 빼면 감사는 배포본과 **다른 상태**를 보게 된다 — 실제로 CI 첫 실행에서
      # hexCenter is not defined가 났고, 로컬은 예전 빌드가 남아 있어 통과했다.
      # 배포(pages.yml)와 같은 순서로 빌드한 뒤 검사한다.
      - name: Build map module
        run: npm run build:map

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: UI 불변식 (넘침·예외·범례·토글 잔존)
        run: node tests/ui/test_ui_invariants.mjs

      # 정적 href 감사와 **별개**다. /history/local/9/는 정적 링크 0 broken 상태에서
      # 404였다 — 런타임 조립·pushState는 파일을 훑어서는 안 보인다.
      - name: route 무결성 (렌더·토글 후·주소창)
        run: node tests/ui/test_routes.mjs

      # 스크린샷은 판정이 아니라 사람이 보는 용도 — 실패시키지 않고 아티팩트로 남긴다.
      - name: 대표 화면 촬영
        if: always()
        run: node tests/ui/shoot.mjs --out=ui-shots
        continue-on-error: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots/
          retention-days: 14
