name: Deploy to GitHub Pages

# 정적 사이트 배포 — master push마다 TS 지도 모듈을 빌드(esbuild)해 산출물 포함 후 배포.
# 기존 legacy(브랜치 직접 서빙) 대체: 이제 assets/hexgrid.js는 커밋 안 하고 CI가 생성.
# GITHUB_TOKEN push는 후속 push 이벤트를 만들지 않는다. 수집 완료 이벤트로 연결하고,
# 최신 master SHA를 고정해 같은 커밋을 검사·배포한다.
on:
  push:
    branches: [master]
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - Daily data refresh
      - Daily tracker refresh
      - Weekly SEO coverage (색인·노출 수집)
      - Election finalize (잠정→확정 승격)
      - Election results polling (개표 추적)
      - Pledge capture (선거공약 캡처)
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중 배포는 취소하지 않음 (프로덕션 배포 보호). 새 푸시는 큐잉.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revision:
    # 수집 실패여도 이미 커밋된 결과가 있을 수 있다. 신뢰하는 기본 브랜치만 읽는다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      changed: ${{ steps.revision.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: 배포할 커밋 고정 (변경 없는 예약 실행은 생략)
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if python3 scripts/audit/check_operations.py --deployment-only --exact; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: revision
    if: needs.revision.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}

  build-deploy:
    timeout-minutes: 30
    needs: [revision, checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.revision.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build map module
        run: npm run build:map

      # 화면을 보고 결함을 판단하려면 '내가 보는 게 최신인가'를 먼저 확정해야 한다.
      # 이미 고친 것을 캐시 때문에 결함으로 보고받은 적이 있다.
      #   확인: curl -s https://polis.ysw.kr/ | grep polis-build
      # 저장소에는 커밋하지 않는다 — 커밋하면 매 배포마다 4,900개가 바뀌고
      # 생성기 멱등성 검사가 매번 깨진다.
      - name: 빌드 SHA 새기기 (배포본 전용)
        run: python3 scripts/build/stamp_build.py --sha "$(git rev-parse --short=12 HEAD)"

      - name: Prune build deps (정적 산출물만 배포)
        run: rm -rf node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # 업로드 확정 직후 deploy-pages가 "No artifacts named ... were found"로 1~2초 만에
      # 실패하는 일이 있다(2026-11-24 하루 4회, 재실행하면 성공). deploy-pages는 러너 내부
      # Twirp ArtifactService로 목록을 보는데, 이건 run 단계에서 부를 수 없고 REST 목록과도
      # 따로 늦는다 — REST로 '보임'을 확인한 직후에도 0개가 나왔다. 그래서 미리 기다리지
      # 않고, 60초 안에 끝난 실패만 30초 뒤 한 번 다시 시도한다. 오래 걸린 실패
      # (syncing_files 시간 초과 등)는 재시도하지 않는다 — job 시간 제한을 넘긴다.
      - name: Deploy 시작 시각
        id: deploy_start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 빠른 실패면 재시도 대기
        id: deploy_gate
        if: steps.deployment.outcome == 'failure'
        run: |
          took=$(( $(date +%s) - ${{ steps.deploy_start.outputs.t }} ))
          if [ "$took" -gt 60 ]; then
            echo "::error::Deploy가 ${took}s 만에 실패 — 아티팩트 조회 실패가 아니므로 재시도하지 않는다"
            exit 1
          fi
          echo "::warning::Deploy가 ${took}s 만에 실패 — 30초 뒤 재시도"
          sleep 30

      - name: Deploy (재시도)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 실제 서비스에 같은 SHA가 반영됐는지 확인
        run: python3 scripts/audit/check_operations.py --deployment-only --exact --attempts 12 --delay 10
