name: Deploy to GitHub Pages

# 정적 사이트 배포 — master push마다 TS 지도 모듈을 빌드(esbuild)해 산출물 포함 후 배포.
# 기존 legacy(브랜치 직접 서빙) 대체: 이제 assets/hexgrid.js는 커밋 안 하고 CI가 생성.
# 데이터 갱신 워크플로(daily-refresh 등)가 master에 push하면 이 워크플로가 자동 재배포.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중 배포는 취소하지 않음 (프로덕션 배포 보호). 새 푸시는 큐잉.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build map module
        run: npm run build:map

      # 화면을 보고 결함을 판단하려면 '내가 보는 게 최신인가'를 먼저 확정해야 한다.
      # 이미 고친 것을 캐시 때문에 결함으로 보고받은 적이 있다.
      #   확인: curl -s https://polis.ysw.kr/ | grep polis-build
      # 저장소에는 커밋하지 않는다 — 커밋하면 매 배포마다 4,900개가 바뀌고
      # 생성기 멱등성 검사가 매번 깨진다.
      - name: 빌드 SHA 새기기 (배포본 전용)
        run: python3 scripts/build/stamp_build.py

      - name: Prune build deps (정적 산출물만 배포)
        run: rm -rf node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
